name: Apply v6.5.0 queue typing fix

on:
  push:
    branches: [work/v6.5.0]
    paths:
      - scripts/fix-v650-promise.py
      - .github/workflows/apply-v650.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/v6.5.0
      - run: python scripts/fix-v650-promise.py
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/cli/index.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: type serialized CLI job updates"
          git push origin HEAD:work/v6.5.0
