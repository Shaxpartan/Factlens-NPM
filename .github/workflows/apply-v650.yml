name: Apply v6.5.0 CLI

on:
  push:
    branches: [work/v6.5.0]
    paths:
      - .github/workflows/apply-v650.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/v6.5.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Synchronize lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: sync v6.5.0 lockfile"
          git push origin HEAD:work/v6.5.0
