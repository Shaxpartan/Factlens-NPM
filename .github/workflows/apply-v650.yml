name: Apply v6.5.0 regression fixes

on:
  push:
    branches: [work/v6.5.0]
    paths:
      - scripts/fix-v650-regressions.py
      - .github/workflows/apply-v650.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/v6.5.0
      - name: Apply focused fixes
        run: python scripts/fix-v650-regressions.py
      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/cli/index.ts tests/cli-core.test.mjs tests/runtime.test.mjs tests/v6.5.0.test.mjs tests/cli-speaker-progress.test.mjs tests/verify-timeout-contract.test.mjs tests/version-6.0.0.test.mjs
          if git diff --cached --quiet; then
            echo "No regression fixes needed."
            exit 0
          fi
          git commit -m "fix: close v6.5.0 CLI regressions"
          git push origin HEAD:work/v6.5.0
