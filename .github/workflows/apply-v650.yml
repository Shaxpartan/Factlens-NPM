name: Apply v6.5.0 CLI

on:
  push:
    branches: [work/v6.5.0]
    paths:
      - scripts/fix-v650-cli.py
      - .github/workflows/apply-v650.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/v6.5.0
      - name: Finalize CLI
        run: python scripts/fix-v650-cli.py
      - name: Validate and commit CLI
        shell: bash
        run: |
          npx --yes typescript@7.0.2 --version >/dev/null 2>&1 || true
          if git diff --quiet -- src/cli/index.ts; then
            echo "No CLI source changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/cli/index.ts
          git commit -m "feat: finalize v6.5.0 CLI output"
          git push origin HEAD:work/v6.5.0
