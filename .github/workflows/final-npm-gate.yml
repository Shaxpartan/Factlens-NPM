name: Final NPM release gate

on:
  push:
    branches:
      - agent/cli-progress-speaker-20260815
    paths:
      - .github/workflows/final-npm-gate.yml

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:examples
      - run: npm pack --dry-run
