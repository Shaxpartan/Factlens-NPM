name: Verify API customization candidate

on:
  push:
    branches: [work/v6.5.0]
    paths:
      - scripts/patch-api-customization-v650.py
      - .github/workflows/api-v650-candidate.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/v6.5.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Clone API main and apply candidate
        run: |
          git clone --depth 1 https://github.com/Shaxpartan/Factlens-API.git _api
          python scripts/patch-api-customization-v650.py _api
      - name: Deno-check platform function
        working-directory: _api
        run: deno check supabase/functions/factlens-api-platform/index.ts
      - name: Run API tests
        working-directory: _api
        run: npm test
      - name: Run API build
        working-directory: _api
        run: npm run build
      - name: Persist verified candidate files
        shell: bash
        run: |
          mkdir -p api-candidate/supabase/functions/factlens-api-platform api-candidate/tests
          cp _api/supabase/functions/factlens-api-platform/index.ts api-candidate/supabase/functions/factlens-api-platform/index.ts
          cp _api/tests/api-key-customization-platform-v84.test.mjs api-candidate/tests/api-key-customization-platform-v84.test.mjs
          cp _api/tests/preauth-wiring.test.mjs api-candidate/tests/preauth-wiring.test.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api-candidate
          git commit -m "chore: store verified API customization candidate"
          git push origin HEAD:work/v6.5.0
