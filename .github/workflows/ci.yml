name: CI

on:
  push:
    branches:
      - main
      - V50.0.0
      - work/v6.7.0-runtime-integration
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        node:
          - 18
          - 20
          - 22
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Canonicalize release source
        run: node scripts/run-v6.7-runtime-release.mjs
      - name: Require canonical tree
        run: git diff --exit-code
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:examples
      - run: npm pack --dry-run
