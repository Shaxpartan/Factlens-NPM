name: CI

on:
  push:
    branches: [main, V50.0.0, agent/source-preferences-20260815]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply guarded source preference edits
        run: |
          if ! grep -q 'trusted_domains?: string\[\]' src/types/index.ts; then
            node scripts/apply-source-preferences.mjs
          fi
      - name: Commit feature branch implementation
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A src package.json package-lock.json README.md docs/runtime-api.md CHANGELOG.md tests/version-1.0.7.test.mjs
            git commit -m "Add SDK and CLI source preferences"
            git push origin HEAD:agent/source-preferences-20260815
          fi
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:examples
      - run: npm pack --dry-run
